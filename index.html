<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-svg, initial-scale=1.0">
    <title>Prode de Oficina - Torneo Clausura</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen flex flex-col justify-between">

    <!-- Header / Navbar -->
<!-- Header con botón de login genérico -->
<header class="bg-slate-800 border-b border-slate-700 shadow-md">
    <div class="max-w-5xl mx-auto px-4 py-4 flex justify-between items-center">
        <h1 class="text-xl font-bold tracking-wider text-emerald-400">⚽ PRODE CLAUSURA</h1>
        <div id="auth-section">
            <button onclick="showAuthModal()" class="bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2 rounded-lg text-sm font-semibold transition">Acceder / Registrarse</button>
        </div>
    </div>
</header>

    <!-- Main Content Container -->
    <main class="max-w-5xl mx-auto px-4 py-8 flex-grow w-full">
        <div id="app-view">
            <div class="text-center py-12">
                <h2 class="text-2xl font-bold mb-4">¡Bienvenido al Prode de la Empresa!</h2>
                <p class="text-slate-400 max-w-lg mx-auto mb-6">Completá tus pronósticos fecha a fecha, sumá puntos por los resultados exactos y ganadores, y mira la tabla de posiciones en tiempo real.</p>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-slate-800 border-t border-slate-700 text-center py-4 text-sm text-slate-400">
        Desarrollado para la competencia interna • Impulsado por Supabase & Vercel
    ></footer>

    <!-- Script de lógica de la aplicación -->
 <script>
    const SUPABASE_URL = 'https://bsobpicsjibsuklgqspw.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJzb2JwaWNzamlic3VrbGdxc3B3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcwNjA5NDYsImV4cCI6MjEwMjYzNjk0Nn0.e0F1cYduq2C_2jO3xbNfxbjKBvH509sUdDNUCpPJ5y0';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function checkUser() {
        const { data: { session } } = await supabaseClient.auth.getSession();
        if (session) updateUIAfterLogin(session.user);
    }

    async function handleAuth(isLogin) {
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;

        if (isLogin) {
            const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
            if (error) alert(error.message);
            else location.reload();
        } else {
            const { error } = await supabaseClient.auth.signUp({ email, password });
            if (error) alert(error.message);
            else alert('¡Registro exitoso! Ya puedes iniciar sesión.');
        }
    }

    function showAuthModal() {
        document.getElementById('app-view').innerHTML = `
            <div class="max-w-md mx-auto bg-slate-800 p-8 rounded-xl border border-slate-700 shadow-lg">
                <h2 class="text-xl font-bold mb-6 text-center">Acceso al Prode</h2>
                <input type="email" id="email" placeholder="Email" class="w-full p-2 mb-4 bg-slate-900 border border-slate-600 rounded text-white">
                <input type="password" id="password" placeholder="Contraseña" class="w-full p-2 mb-6 bg-slate-900 border border-slate-600 rounded text-white">
                <div class="flex gap-2">
                    <button onclick="handleAuth(true)" class="flex-1 bg-emerald-600 py-2 rounded font-bold hover:bg-emerald-500">Ingresar</button>
                    <button onclick="handleAuth(false)" class="flex-1 bg-slate-700 py-2 rounded font-bold hover:bg-slate-600">Registrarse</button>
                </div>
            </div>
        `;
    }

    async function logout() {
        await supabaseClient.auth.signOut();
        location.reload();
    }

    function updateUIAfterLogin(user) {
        document.getElementById('auth-section').innerHTML = `
            <span class="text-sm mr-4 text-slate-300">${user.email}</span>
            <button onclick="logout()" class="bg-rose-600 px-3 py-1 rounded text-xs">Salir</button>
        `;
        loadDashboard(user);
    }

    // Mantén las funciones loadDashboard, fetchFixture, etc., que ya tenías.
    checkUser();
</script>
</body>
</html>
